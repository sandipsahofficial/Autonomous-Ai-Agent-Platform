networks:
  mesh_network:
    external: true
    name: autonomousaiagentplatform_mesh_network

volumes:
  mesh_workspace_data:

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-agent_admin}:${POSTGRES_PASSWORD:-agent_secret_password}@agent_postgres:5432/${POSTGRES_DB:-agent_platform}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - mesh_workspace_data:/app/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mesh_network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - mesh_network
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
